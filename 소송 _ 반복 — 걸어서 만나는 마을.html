<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>소송 : 반복 — 걸어서 만나는 마을</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#18181a;--ink:#f1efe9;--box:rgba(20,20,22,.93);--f:'Jua','Noto Serif KR',sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6))}
#fx::after{content:"";position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#hud{position:fixed;z-index:2;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));padding:6px 12px;background:var(--box);border:2px solid #d9d6cd;font-size:14px}
#stick{position:fixed;z-index:2;left:calc(22px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;border:2px solid rgba(241,239,233,.4);background:rgba(241,239,233,.08);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(241,239,233,.55)}
#btnA{position:fixed;z-index:2;right:calc(28px + env(safe-area-inset-right));bottom:calc(52px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;border:2px solid var(--ink);background:rgba(241,239,233,.1);display:grid;place-items:center;font-size:16px;font-weight:700;opacity:.55;transition:background .15s,color .15s,opacity .15s}
#btnA.on{background:rgba(241,239,233,.92);color:#18181a;opacity:1}
body.lock #stick,body.lock #btnA{display:none}
#dlg{display:none;position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 28px));min-height:128px;padding:12px 18px 18px;background:var(--box);border:2px solid #d9d6cd;box-shadow:0 0 0 3px #000}
#who{font-weight:700;font-size:15px;margin-bottom:6px;color:#cfc9ba}
#txt{font-size:18px;line-height:1.75;word-break:keep-all;min-height:3.5em}
#nx{position:absolute;right:14px;bottom:8px;font-size:12px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#card{position:fixed;z-index:4;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:rgba(18,18,20,.9)}
#card h1{font-family:'Noto Serif KR',serif;font-size:clamp(40px,12vw,64px);margin:0 0 14px;letter-spacing:.02em}
#card p{margin:0;font-size:16px;line-height:1.8;color:#cfc9ba;word-break:keep-all}
#card button{margin-top:22px;padding:12px 28px;font:700 17px inherit;font-family:inherit;color:var(--ink);background:none;border:2px solid var(--ink);cursor:pointer}
#card button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#who,#btnA{font-weight:400}
#dlg{align-items:flex-start}
#port{width:88px;height:88px;flex:none;margin-right:14px;border:2px solid #d9d6cd;background:#2a2a30;image-rendering:pixelated}
#body{flex:1;min-width:0}
#mm{position:fixed;z-index:2;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:112px;height:112px;border:2px solid #d9d6cd;background:#18181a;image-rendering:pixelated;opacity:.93}
#mm.big{width:min(86vw,86vh,400px);height:min(86vw,86vh,400px);top:50%;right:50%;transform:translate(50%,-50%);z-index:3}
#ln{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);margin-top:18px}
#ln a,#ln span{padding:12px;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-size:17px}
#ln span{opacity:.4}
#fd{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5;transition:opacity .28s}
#place{position:fixed;z-index:3;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;background:var(--box);border:2px solid #d9d6cd;padding:8px 18px;white-space:nowrap}
#place b{display:block;font-size:20px;font-weight:400}
#place i{font-style:normal;font-size:13px;color:#cfc9ba}
#card{justify-content:flex-start;overflow-y:auto}
#card::before,#card::after{content:"";flex:1 0 0}
#pt{height:min(38vh,360px);max-width:100%;object-fit:contain;border:2px solid #d9d6cd;margin-top:14px;cursor:pointer}
#pz{display:none;position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.96);overflow:auto;touch-action:pan-x pan-y pinch-zoom}
#pz img{display:block;width:min(100%,760px);margin:0 auto}
#pzx{position:fixed;right:calc(14px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));z-index:7;padding:8px 16px;font-family:inherit;font-size:16px;color:var(--ink);background:var(--box);border:2px solid var(--ink);cursor:pointer}
</style>
</head>
<body class="lock">
<canvas id="c"></canvas><div id="fx"></div>
<div id="hud">만난 사람 0/7</div>
<canvas id="mm" width="64" height="64"></canvas>
<div id="stick"><div id="knob"></div></div>
<div id="btnA">대화</div>
<div id="fd"></div><div id="place"><b></b><i></i></div>
<div id="dlg"><canvas id="port" width="48" height="48"></canvas><div id="body"><div id="who"></div><div id="txt"></div></div><div id="nx">▼</div></div>
<div id="card"></div>
